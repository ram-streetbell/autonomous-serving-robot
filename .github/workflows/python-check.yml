name: Robot package check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python runtime dependency
        run: python -m pip install pyserial
      - name: Compile Python sources
        run: python -m compileall -q serving_robot scripts
      - name: Validate package files
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('serving_robot/package.xml')
          required = [
              'serving_robot/setup.py',
              'serving_robot/launch/hardware.launch.py',
              'serving_robot/launch/mapping.launch.py',
              'serving_robot/launch/autonomy.launch.py',
              'scripts/robot_setup_app.py',
              'scripts/commissioning_check.py',
              'firmware/esp32_motor_interface/esp32_motor_interface.ino',
          ]
          missing = [p for p in required if not Path(p).exists()]
          assert not missing, missing
          print('package files present')
          PY
      - name: Package test build
        run: git archive --format=zip --output=autonomous-serving-robot-0.4.0.zip HEAD
      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-serving-robot-0.4.0
          path: autonomous-serving-robot-0.4.0.zip
          if-no-files-found: error
