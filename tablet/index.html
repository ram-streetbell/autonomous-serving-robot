<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serving Robot</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:24px;text-align:center}button{font-size:22px;padding:22px;margin:7px;min-width:130px;border-radius:14px;border:1px solid #aaa;background:#f5f5f5}.stop{font-weight:700}.tables button{font-size:18px;padding:15px}.status{margin:20px;padding:12px;border-radius:10px;background:#eee}</style></head>
<body><h1>Serving Robot</h1><div class="status" id="status">Disconnected</div>
<div><button onclick="drive(0.25,0)">Forward</button></div><div><button onclick="drive(0,0.6)">Left</button><button class="stop" onclick="stop()">STOP</button><button onclick="drive(0,-0.6)">Right</button></div><div><button onclick="drive(-0.20,0)">Reverse</button></div>
<h2>Serve</h2><div class="tables"><button onclick="go('table_1')">Table 1</button><button onclick="go('table_2')">Table 2</button><button onclick="go('base')">Return to Base</button></div>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script><script>
const host=location.hostname||'localhost';const port=9090;const status=document.getElementById('status');let ros;
try{ros=new ROSLIB.Ros({url:`ws://${host}:${port}`});ros.on('connection',()=>status.textContent='Connected');ros.on('error',()=>status.textContent='Connection error');ros.on('close',()=>status.textContent='Disconnected')}catch(e){status.textContent='ROS connection unavailable'}
const cmd=()=>new ROSLIB.Topic({ros,name:'/cmd_vel',messageType:'geometry_msgs/msg/Twist'});
function drive(v,w){if(!ros)return;cmd().publish(new ROSLIB.Message({linear:{x:v,y:0,z:0},angular:{x:0,y:0,z:w}}))}function stop(){drive(0,0)}
function go(name){if(!ros)return;const t=new ROSLIB.Topic({ros,name:'/serving/command',messageType:'std_msgs/msg/String'});t.publish(new ROSLIB.Message({data:JSON.stringify({go:name})}));status.textContent='Command sent: '+name}
</script></body></html>
